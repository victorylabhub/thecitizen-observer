# Netlify builds the site from the repository. Each story published from the
# newsroom panel (/admin/) is merged into main and triggers a new deploy.
[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/elections/2026"
  to = "/elections/2026/"
  status = 301
